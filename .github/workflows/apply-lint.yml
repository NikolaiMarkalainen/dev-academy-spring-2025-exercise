description: Verifying lint status and applying fixes to frontend
run-name: ${{ github.actor }} is running LintFix
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Installing node dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Applying ESLint Fix
        run: npm run lint:fix
        working-directory: ./frontend
